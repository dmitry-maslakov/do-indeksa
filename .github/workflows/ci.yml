name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bank:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          REGISTRY: ${{ secrets.ZOT_REGISTRY }}
          AUTH: ${{ secrets.ZOT_USER }}:${{ secrets.ZOT_PASS }}
        run: |
          tag="$GITHUB_SHA-$(git rev-parse --short=12 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] && curl -fsI -u "$AUTH" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "https://$REGISTRY/v2/do-indeksa/migrate/manifests/$tag" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: bank
    if: ${{ !cancelled() && needs.bank.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - if: github.event_name == 'pull_request'
        name: Task ids are stable
        run: test -z "$(git diff --diff-filter=DR --name-only ${{ github.event.pull_request.base.sha }} HEAD -- content/tasks)"
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm i18n
      - run: pnpm test
      - run: pnpm exec drizzle-kit check
      - name: Migrations match the schema
        run: timeout 60 pnpm db:generate </dev/null && git diff --exit-code drizzle/ && test -z "$(git status --porcelain drizzle/)"
      - run: pnpm db:migrate
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: build-only-not-a-secret-build-only
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only

  image:
    needs: [bank, check]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci" --health-interval 2s --health-retries 15
    permissions:
      contents: read
      pull-requests: write
    env:
      TAG: ${{ needs.bank.outputs.tag || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
      BANK: ${{ github.event_name != 'pull_request' }}
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - run: |
          echo "WEB=$REGISTRY/do-indeksa/app:$TAG" >> "$GITHUB_ENV"
          echo "MIGRATE=$REGISTRY/do-indeksa/migrate:$TAG" >> "$GITHUB_ENV"
        env:
          REGISTRY: ${{ secrets.ZOT_REGISTRY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.BANK == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: bank
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ZOT_REGISTRY }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASS }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          build-args: |
            GIT_SHA=${{ env.TAG }}
            CONTENT_DIR=${{ env.BANK == 'true' && 'bank' || 'content' }}
          load: true
          tags: ${{ env.WEB }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Smoke test
        run: |
          docker run -d --name web --network host -e DATABASE_URL \
            -e BETTER_AUTH_SECRET=smoke-test-not-a-secret-smoke-test \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e GOOGLE_CLIENT_ID=smoke -e GOOGLE_CLIENT_SECRET=smoke "$WEB"
          for _ in $(seq 30); do curl -fs localhost:3000/api/healthz && exit 0; sleep 1; done
          docker logs web
          exit 1
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        run: docker logs web
      - if: env.PUSH == 'true'
        run: docker push "$WEB"
      - if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ env.MIGRATE }}
      - if: env.PUSH == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx preview; then
            gh pr edit "$PR" --add-label preview
            gh pr comment "$PR" --body "Preview: https://pr-$PR.doindeksa.rs (ready a few minutes after each push)"
          fi
