name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U ci" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - if: github.event_name == 'pull_request'
        name: Task ids are stable
        run: test -z "$(git diff --diff-filter=DR --name-only ${{ github.event.pull_request.base.sha }} HEAD -- content/tasks)"
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm i18n
      - run: pnpm test
      - run: pnpm exec drizzle-kit check
      - name: Migrations match the schema
        run: timeout 60 pnpm db:generate </dev/null && git diff --exit-code drizzle/ && test -z "$(git status --porcelain drizzle/)"
      - run: pnpm db:migrate
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: build-only-not-a-secret-build-only
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only

  image:
    needs: check
    runs-on: ubuntu-24.04
    env:
      WEB: ${{ secrets.ZOT_REGISTRY }}/do-indeksa/do-indeksa-web:${{ github.sha }}
      MIGRATE: ${{ secrets.ZOT_REGISTRY }}/do-indeksa/do-indeksa-migrate:${{ github.sha }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ZOT_REGISTRY }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASS }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: runner
          build-args: GIT_SHA=${{ github.sha }}
          load: true
          tags: ${{ env.WEB }}
      - name: Smoke test
        run: |
          docker run -d --name web -p 3000:3000 \
            -e DATABASE_URL=postgres://smoke:smoke@localhost:5432/smoke \
            -e BETTER_AUTH_SECRET=smoke-test-not-a-secret-smoke-test \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e GOOGLE_CLIENT_ID=smoke -e GOOGLE_CLIENT_SECRET=smoke "$WEB"
          for _ in $(seq 30); do curl -fs localhost:3000/api/healthz && exit 0; sleep 1; done
          docker logs web
          exit 1
      - if: env.PUSH == 'true'
        run: docker push "$WEB"
      - if: env.PUSH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          target: migrate
          push: true
          tags: ${{ env.MIGRATE }}
