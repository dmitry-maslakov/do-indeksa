name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  bank:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
          REGISTRY: ${{ secrets.ZOT_REGISTRY }}
          AUTH: ${{ secrets.ZOT_USER }}:${{ secrets.ZOT_PASS }}
        run: |
          tag="$GITHUB_SHA-$(git rev-parse --short=12 HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] && curl -fsI -u "$AUTH" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json" \
            "https://$REGISTRY/v2/do-indeksa/migrate/manifests/$tag" >/dev/null; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: bank
    if: ${{ !cancelled() && needs.bank.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - if: github.event_name == 'pull_request'
        name: Task ids are stable
        run: test -z "$(git diff --diff-filter=DR --name-only ${{ github.event.pull_request.base.sha }} HEAD -- content/tasks)"
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm i18n
      - run: pnpm test
      - run: pnpm exec drizzle-kit check
      - name: Migrations match the schema
        run: timeout 60 pnpm db:generate </dev/null && git diff --exit-code drizzle/ && test -z "$(git status --porcelain drizzle/)"

  e2e:
    needs: bank
    if: ${{ !cancelled() && needs.bank.outputs.build != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      app: ${{ steps.app.outputs.digest }}
      migrate: ${{ steps.migrate.outputs.digest }}
    env:
      TAG: ${{ needs.bank.outputs.tag || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
      TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: smoke-test-not-a-secret-smoke-test
    steps:
      - run: |
          docker pull -q mirror.gcr.io/moby/buildkit:buildx-stable-1 > /dev/null 2>&1 &
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci \
            mirror.gcr.io/library/postgres:17 > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: bank
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.TRUSTED == 'true'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/build-cache
          key: build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: build-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: steps.cache.outputs.cache-matched-key
        run: openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in "$RUNNER_TEMP/build-cache" | tar -x --zstd
        env:
          KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
      - run: pnpm build
        env:
          GIT_SHA: ${{ env.TAG }}
          CONTENT_DIR: ${{ github.event_name == 'pull_request' && 'content' || 'bank' }}
          NEXT_TELEMETRY_DISABLED: 1
          DATABASE_URL: postgres://build:build@localhost:5432/build
          BETTER_AUTH_SECRET: build-only-not-a-secret-build-only
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-only
          GOOGLE_CLIENT_SECRET: build-only
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SENTRY_AUTH_TOKEN || '' }}
      - run: pnpm db:bundle
      - run: |
          base=$(awk '/ AS runner$/ {print $2}' Dockerfile)
          echo "BASE=$base" >> "$GITHUB_ENV"
          docker build --build-context "$base=docker-image://mirror.gcr.io/library/$base" --target runner -t app .
          docker build --build-context "$base=docker-image://mirror.gcr.io/library/$base" --target migrate -t migrate .
      - run: |
          timeout 30 sh -c 'until docker exec postgres pg_isready -U ci; do sleep 1; done'
          docker run --rm --network host -e DATABASE_URL migrate
      - name: Smoke test
        run: |
          docker run -d --name web --network host -e DATABASE_URL \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e GOOGLE_CLIENT_ID=smoke -e GOOGLE_CLIENT_SECRET=smoke app
          for _ in $(seq 30); do curl -fs localhost:3000/api/healthz && exit 0; sleep 1; done
          docker logs web
          exit 1
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e
      - if: failure()
        run: docker logs web
      - if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: test-results
          retention-days: 7
      - if: env.TRUSTED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ZOT_REGISTRY }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASS }}
      - if: env.TRUSTED == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          cleanup: false
      - if: env.TRUSTED == 'true'
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          build-contexts: ${{ env.BASE }}=docker-image://mirror.gcr.io/library/${{ env.BASE }}
          outputs: type=image,name=${{ secrets.ZOT_REGISTRY }}/do-indeksa/app,push-by-digest=true,name-canonical=true,push=true
      - if: env.TRUSTED == 'true'
        id: migrate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migrate
          build-contexts: ${{ env.BASE }}=docker-image://mirror.gcr.io/library/${{ env.BASE }}
          outputs: type=image,name=${{ secrets.ZOT_REGISTRY }}/do-indeksa/migrate,push-by-digest=true,name-canonical=true,push=true
      - if: env.TRUSTED == 'true' && (github.ref == 'refs/heads/main' || !steps.cache.outputs.cache-matched-key)
        run: tar -c --zstd .next/cache .content-collections/cache | openssl enc -aes-256-cbc -pbkdf2 -pass env:KEY -out "$RUNNER_TEMP/build-cache"
        env:
          KEY: ${{ secrets.CONTENT_DEPLOY_KEY }}
      - if: env.TRUSTED == 'true' && (github.ref == 'refs/heads/main' || !steps.cache.outputs.cache-matched-key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/build-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

  image:
    needs: [bank, check, e2e]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      TAG: ${{ needs.bank.outputs.tag || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha) }}
      TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      REGISTRY: ${{ secrets.ZOT_REGISTRY }}
    steps:
      - name: Images were built and tested
        env:
          E2E: ${{ needs.e2e.result }}
        run: test "$E2E" = success
      - if: env.TRUSTED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.ZOT_REGISTRY }}
          username: ${{ secrets.ZOT_USER }}
          password: ${{ secrets.ZOT_PASS }}
      - if: env.TRUSTED == 'true'
        env:
          APP: ${{ needs.e2e.outputs.app }}
          MIGRATE: ${{ needs.e2e.outputs.migrate }}
        run: |
          docker buildx imagetools create --prefer-index=false -t "$REGISTRY/do-indeksa/app:$TAG" "$REGISTRY/do-indeksa/app@$APP"
          docker buildx imagetools create --prefer-index=false -t "$REGISTRY/do-indeksa/migrate:$TAG" "$REGISTRY/do-indeksa/migrate@$MIGRATE"
      - if: env.TRUSTED == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr edit "$PR" --add-label preview
          id=$(jq -n --arg ref "$SHA" '{ref: $ref, environment: "preview", auto_merge: false, required_contexts: [], transient_environment: true}' \
            | gh api "repos/$GH_REPO/deployments" --input - --jq .id)
          gh api "repos/$GH_REPO/deployments/$id/statuses" -f state=success \
            -f environment_url="https://pr-$PR.doindeksa.rs" -F auto_inactive=false >/dev/null
